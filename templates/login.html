{% extends "auth_base.html" %}
{% block title %}Log in — Telos{% endblock %}
{% block auth_title %}Welcome back{% endblock %}

{% block auth_body %}
<form method="POST" class="auth-form">
  <div class="form-group">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" type="email" id="email" name="email"
           placeholder="you@example.com" autocomplete="email" required autofocus>
  </div>
  <div class="form-group">
    <div class="form-label-row">
      <label class="form-label" for="password">Password</label>
      <a href="{{ url_for('forgot_password') }}" class="auth-link auth-link-sm">Forgot password?</a>
    </div>
    <input class="form-control" type="password" id="password" name="password"
           placeholder="••••••••" autocomplete="current-password" required>
  </div>
  <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
</form>
{% endblock %}

{% block auth_footer %}
<div class="auth-foot">
  No account yet? <a href="{{ url_for('register') }}" class="auth-link">Create one</a>
</div>
{% endblock %}
